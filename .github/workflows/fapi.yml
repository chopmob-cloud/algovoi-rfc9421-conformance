# 12-way FAPI 2.0 Message Signing consensus — enforce byte-for-byte parity on every push.
#
# Runs all twelve independent language runners against the one frozen, signed
# FAPI 2.0 Message Signing profile corpus (fapi_messagesigning_v0, 31 cases across six sections) via
# tools/run_consensus_fapi.sh --require 12. The job fails unless every runner
# reproduces every case (each exits 0 iff it matched the frozen oracle, so
# all-pass = all-agree byte-for-byte) and all twelve are present: a missing
# toolchain shrinks N below --require and fails closed.
#
# Unlike the negative-battery workflow, the go and rust runners are self-contained
# in this repo, so there are no sibling verifier checkouts. The KAT gate
# (tools/check_kat_wba.py) runs first inside the driver.

name: 12-way FAPI 2.0 Message Signing consensus

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fapi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  consensus:
    name: fapi_messagesigning_v0 (require 12)
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      # --- twelve toolchains ---
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with: { python-version: "3.12" }
        # `cryptography` is used by the KAT gate (tools/check_kat_wba.py) to verify
        # Ed25519 independently of the verifier's PyNaCl backend.
      - run: python -m pip install --quiet algovoi-rfc9421-verifier cryptography

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with: { node-version: "20" }   # the fapi runner uses only node built-ins

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
        with: { go-version: "1.22" }

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # stable
        with:
          toolchain: stable

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with: { distribution: temurin, java-version: "17" }

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962  # v2
        with:
          php-version: "8.3"
          extensions: gmp

      - uses: ruby/setup-ruby@354a1ad156761f5ee2b7b13fa8e09943a5e8d252  # v1.229.0
        with: { ruby-version: "3.2" }

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4
        with: { dotnet-version: "9.0.x" }

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124  # v1
        with: { otp-version: "26", elixir-version: "1.16" }

      - name: Kotlin compiler
        run: |
          set -euo pipefail
          KV=2.0.20
          KOTLIN_SHA256="5f5d2a8ad6a718a002acd0775b67a9e27035872fdbd4b0791e3cb3ea00095931"
          curl -fsSL -o /tmp/kotlin.zip "https://github.com/JetBrains/kotlin/releases/download/v${KV}/kotlin-compiler-${KV}.zip"
          echo "${KOTLIN_SHA256}  /tmp/kotlin.zip" | sha256sum -c -
          sudo unzip -q /tmp/kotlin.zip -d /opt
          echo "/opt/kotlinc/bin" >> "$GITHUB_PATH"

      # --- jars for the JVM runners (gitignored; fetched from Maven Central).
      #     java uses org.json; kotlin uses Jackson + Bouncy Castle. ---
      - name: Fetch JVM jars
        run: |
          set -euo pipefail
          B=https://repo1.maven.org/maven2
          mkdir -p runners/java/libs runners/kotlin/libs
          curl -fsSL "$B/org/json/json/20240303/json-20240303.jar" -o runners/java/libs/json-20240303.jar
          echo "3cf6cd6892e32e2b4c1c39e0f52f5248a2f5b37646fdfbb79a66b46b618414ed  runners/java/libs/json-20240303.jar" | sha256sum -c -
          curl -fsSL "$B/com/fasterxml/jackson/core/jackson-core/2.17.0/jackson-core-2.17.0.jar" -o "runners/kotlin/libs/jackson-core-2.17.0.jar"
          echo "55be130f6a68038088a261856c4e383ce79957a0fc1a29ecb213a9efd6ef4389  runners/kotlin/libs/jackson-core-2.17.0.jar" | sha256sum -c -
          curl -fsSL "$B/com/fasterxml/jackson/core/jackson-databind/2.17.0/jackson-databind-2.17.0.jar" -o "runners/kotlin/libs/jackson-databind-2.17.0.jar"
          echo "d0ed5b54cb1b0bbb0828e24ce752a43a006dc188b34e3a4ae3238acc7b637418  runners/kotlin/libs/jackson-databind-2.17.0.jar" | sha256sum -c -
          curl -fsSL "$B/com/fasterxml/jackson/core/jackson-annotations/2.17.0/jackson-annotations-2.17.0.jar" -o "runners/kotlin/libs/jackson-annotations-2.17.0.jar"
          echo "8562569a001d46e84ea23802257e33c8f68b24eb47c1e0efd133a0372c512959  runners/kotlin/libs/jackson-annotations-2.17.0.jar" | sha256sum -c -
          curl -fsSL "$B/org/bouncycastle/bcprov-jdk18on/1.78.1/bcprov-jdk18on-1.78.1.jar" -o "runners/kotlin/libs/bcprov-jdk18on-1.78.1.jar"
          echo "add5915e6acfc6ab5836e1fd8a5e21c6488536a8c1f21f386eeb3bf280b702d7  runners/kotlin/libs/bcprov-jdk18on-1.78.1.jar" | sha256sum -c -

      - name: C deps (jansson, libssl)
        run: sudo apt-get update -q && sudo apt-get install -y -q libjansson-dev libssl-dev pkg-config

      - name: Scala CLI
        run: |
          set -euo pipefail
          SCV=1.6.1
          SCALA_SHA256="ffb7f96ab4750fa3e2e4e4c2fab7e7275683b0547250cae302f8243055a8decc"
          curl -fsSL -o /tmp/scala-cli.gz \
            "https://github.com/VirtusLab/scala-cli/releases/download/v${SCV}/scala-cli-x86_64-pc-linux.gz"
          echo "${SCALA_SHA256}  /tmp/scala-cli.gz" | sha256sum -c -
          gzip -df /tmp/scala-cli.gz
          chmod +x /tmp/scala-cli
          sudo mv /tmp/scala-cli /usr/local/bin/scala-cli
          scala-cli version

      # --- the invariant: full 12-way consensus (KAT-gated), or the job fails ---
      - name: Run N-way consensus
        run: bash tools/run_consensus_fapi.sh --require 12
