# 12-way CBOR Object Signing (COSE) consensus: enforce byte-for-byte parity on every push.
#
# Runs all twelve independent language runners against the one frozen, signed
# cose_v0 corpus (COSE_Sign1, RFC 9052/9053 + RFC 8949 deterministic CBOR, 26
# cases across eight sections) via tools/run_consensus_cose.sh --require 12. The
# job fails unless every runner reproduces every case (each exits 0 iff it matched
# the frozen oracle, so all-pass = all-agree byte-for-byte) and all twelve are
# present: a missing toolchain shrinks N below --require and fails closed.
#
# The KAT integrity gate (tools/check_kat_cose.py) runs first inside the driver and
# re-derives every verdict with a separate third-party COSE implementation
# (pycose) plus an independent cbor2 canonical check. Each runner hand-rolls its
# CBOR codec (a permissive decoder plus an RFC 8949 Section 4.2 bytewise canonical
# encoder) so the deterministic-CBOR judgement and the Sig_structure bytes are
# byte-identical across all twelve languages, and reuses its existing ES256 /
# EdDSA / RSA-PSS crypto stack from the FAPI and JWS runners.

name: 12-way COSE consensus

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cose-${{ github.ref }}
  cancel-in-progress: true

jobs:
  consensus:
    name: cose_v0 (require 12)
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4

      # --- twelve toolchains ---
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
        # cbor2 + pycose re-derive every verdict in the KAT gate independently of
        # our oracle; PyNaCl verifies the signed corpus head.
      - run: python -m pip install --quiet cbor2 pycose cryptography pynacl

      - uses: actions/setup-node@v4
        with: { node-version: "20" }   # the cose runner hand-rolls CBOR, uses only node:crypto

      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: gmp, sodium   # gmp for the hand-rolled EMSA-PSS verify, sodium for Ed25519

      - uses: ruby/setup-ruby@v1
        with: { ruby-version: "3.2" }   # the cose runner uses OpenSSL built-ins

      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "9.0.x" }   # Bouncy Castle (Ed25519) restored via PackageReference

      - uses: erlef/setup-beam@v1
        with: { otp-version: "26", elixir-version: "1.16" }

      - name: Kotlin compiler
        run: |
          set -euo pipefail
          KV=2.0.20
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 4 --retry-max-time 180 -o /tmp/kotlin.zip "https://github.com/JetBrains/kotlin/releases/download/v${KV}/kotlin-compiler-${KV}.zip"
          sudo unzip -q /tmp/kotlin.zip -d /opt
          echo "/opt/kotlinc/bin" >> "$GITHUB_PATH"

      # --- JSON jars for the JVM runners (gitignored; fetched from Maven Central).
      #     cose_v0 hand-rolls CBOR and uses JDK-native Ed25519, so java uses
      #     org.json and kotlin uses Jackson; no Bouncy Castle is needed. ---
      - name: Fetch JVM jars
        run: |
          set -euo pipefail
          B=https://repo1.maven.org/maven2
          J=2.17.0
          RETRY="--retry 5 --retry-all-errors --retry-delay 4 --retry-max-time 180"
          mkdir -p runners/java/libs runners/kotlin/libs
          curl -fsSL $RETRY "$B/org/json/json/20240303/json-20240303.jar" -o runners/java/libs/json-20240303.jar
          for j in \
            com/fasterxml/jackson/core/jackson-core/$J/jackson-core-$J.jar \
            com/fasterxml/jackson/core/jackson-databind/$J/jackson-databind-$J.jar \
            com/fasterxml/jackson/core/jackson-annotations/$J/jackson-annotations-$J.jar; do
            curl -fsSL $RETRY "$B/$j" -o "runners/kotlin/libs/$(basename "$j")"
          done

      - name: C deps (jansson, libssl)
        run: sudo apt-get update -q && sudo apt-get install -y -q libjansson-dev libssl-dev pkg-config

      - name: Scala CLI
        run: |
          set -euo pipefail
          curl -fsL --retry 5 --retry-all-errors --retry-delay 4 --retry-max-time 180 -o /tmp/scala-cli.gz https://github.com/VirtusLab/scala-cli/releases/latest/download/scala-cli-x86_64-pc-linux.gz
          gzip -df /tmp/scala-cli.gz
          chmod +x /tmp/scala-cli
          sudo mv /tmp/scala-cli /usr/local/bin/scala-cli
          scala-cli version

      # --- the invariant: full 12-way consensus (KAT-gated), or the job fails ---
      - name: Run N-way consensus
        run: bash tools/run_consensus_cose.sh --require 12
