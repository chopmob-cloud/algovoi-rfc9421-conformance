[package]
name = "jws-runner"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["AlgoVoi <chopmob@gmail.com>"]
description = "Rust runner for the JSON Web Signature corpus (jws_v0). Self-contained; reproduces every verdict in the frozen corpus."

[[bin]]
name = "verify_jws"
path = "src/main.rs"

[dependencies]
# Versions pinned to the sibling rust-fapi / rust-wba crates so the already-cached
# crates resolve offline. `rsa` (sha2 feature) does RS256 (RSASSA-PKCS1v15 SHA-256),
# `p256` does ES256 (from_sec1_bytes enforces the on-curve check), and
# `ed25519-dalek` does EdDSA (Ed25519).
serde_json = "1"
base64 = "0.22"
rsa = { version = "0.9", features = ["sha2"] }
p256 = { version = "0.13", features = ["ecdsa", "arithmetic"] }
ed25519-dalek = "2"
