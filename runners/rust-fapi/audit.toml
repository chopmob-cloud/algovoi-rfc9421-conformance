# cargo-audit configuration for the rust-fapi runner.
#
# RUSTSEC-2023-0071 (Marvin Attack) is a timing sidechannel in the `rsa` crate's
# PRIVATE-KEY operations (RSA decryption / private-key use), exploited to recover
# a private key from an oracle that decrypts attacker-chosen ciphertexts. This
# runner only performs PUBLIC-KEY RSA-PSS *verification* of the frozen corpus
# vectors: it holds no private key, never decrypts, and is not a network oracle,
# so the sidechannel has nothing to attack. There is no fixed `rsa` version to
# upgrade to (Solution: "No fixed upgrade is available"). Documented ignore; the
# usage is verify-only and out of scope for this advisory.
[advisories]
ignore = ["RUSTSEC-2023-0071"]
